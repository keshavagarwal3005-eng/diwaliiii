<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Diwali, Pyaarii! ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at center, #1b0c2a 0%, #080312 80%, #020106 100%);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Fireworks Canvas */
    #fireworksCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Background Ambient Stars/Floating Sparks */
    .lantern-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .sky-lantern {
      position: absolute;
      bottom: -60px;
      width: 24px;
      height: 34px;
      background: radial-gradient(circle, #ffeed1 20%, #ff8800 70%, #d83c00 100%);
      border-radius: 6px 6px 4px 4px;
      box-shadow: 0 0 16px rgba(255, 140, 0, 0.9);
      animation: floatUp linear infinite;
      opacity: 0.85;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.8) rotate(-4deg);
        opacity: 0;
      }
      10% { opacity: 0.9; }
      90% { opacity: 0.8; }
      100% {
        transform: translateY(-115vh) scale(1.1) rotate(6deg);
        opacity: 0;
      }
    }

    /* Main Container */
    .main-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 520px;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Initial Trigger Button Area */
    #startScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    #startScreen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.9);
      position: absolute;
    }

    .diya-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      outline: none;
      margin-top: 15px;
      transition: transform 0.25s ease;
    }

    .diya-btn:hover {
      transform: scale(1.08);
    }

    .diya-btn:active {
      transform: scale(0.96);
    }

    .flame {
      width: 28px;
      height: 48px;
      background: radial-gradient(ellipse at bottom, #fff7bd 0%, #ffbb00 45%, #ff3b00 80%, transparent 100%);
      border-radius: 50% 50% 35% 35% / 60% 60% 40% 40%;
      filter: drop-shadow(0 0 16px #ff9900) drop-shadow(0 0 32px #ff4800);
      animation: flicker 1.4s infinite alternate ease-in-out;
      transform-origin: bottom center;
      margin-bottom: -6px;
    }

    @keyframes flicker {
      0% { transform: scale(1) rotate(-2deg); filter: drop-shadow(0 0 14px #ffaa00); }
      50% { transform: scale(1.06, 1.12) rotate(2deg); filter: drop-shadow(0 0 22px #ff5500); }
      100% { transform: scale(0.95, 0.98) rotate(-1deg); filter: drop-shadow(0 0 16px #ff8800); }
    }

    .diya-base {
      width: 86px;
      height: 38px;
      background: linear-gradient(180deg, #d97706 0%, #92400e 65%, #572002 100%);
      border-radius: 0 0 60px 60px;
      border-top: 3px solid #fef08a;
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.4);
      position: relative;
    }

    .diya-base::after {
      content: "";
      position: absolute;
      top: -6px;
      left: 10%;
      width: 80%;
      height: 6px;
      background: #f59e0b;
      border-radius: 50%;
    }

    .hint-text {
      margin-top: 26px;
      font-size: 1.05rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #fde68a;
      text-shadow: 0 0 10px rgba(253, 230, 138, 0.6);
      animation: pulseText 2s infinite ease-in-out;
    }

    @keyframes pulseText {
      0%, 100% { opacity: 0.7; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }

    /* Reveal Content Section */
    #revealSection {
      opacity: 0;
      transform: scale(0.85) translateY(20px);
      pointer-events: none;
      transition: opacity 1s cubic-bezier(0.2, 0.8, 0.2, 1), transform 1s cubic-bezier(0.2, 0.8, 0.2, 1);
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #revealSection.active {
      opacity: 1;
      transform: scale(1) translateY(0);
      pointer-events: auto;
    }

    /* Photo Frame with glowing rangoli ring */
    .photo-card {
      position: relative;
      width: 250px;
      height: 250px;
      margin: 10px auto 20px;
      border-radius: 50%;
      padding: 8px;
      background: radial-gradient(circle, #f59e0b, #b45309, #78350f);
      box-shadow: 0 0 35px rgba(245, 158, 11, 0.8), 0 0 70px rgba(217, 119, 6, 0.45);
      animation: rotateGlow 8s linear infinite;
    }

    @keyframes rotateGlow {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(36deg); }
    }

    .photo-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      border: 3.5px solid #fff3c4;
      background: #11071f;
      position: relative;
    }

    .photo-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
    }

    /* Headings */
    .wishing-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.65rem;
      font-weight: 700;
      color: #fef3c7;
      text-shadow: 0 0 15px rgba(251, 191, 36, 0.9), 0 0 30px rgba(245, 158, 11, 0.6);
      margin-bottom: 4px;
      line-height: 1.35;
    }

    .girlfriend-name {
      font-family: 'Great Vibes', cursive;
      font-size: 3.2rem;
      color: #ffd700;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.9), 0 0 40px rgba(245, 158, 11, 0.7);
      margin-top: -6px;
      margin-bottom: 12px;
      line-height: 1.1;
    }

    /* Expanding Note Card */
    .note-card {
      width: 100%;
      background: rgba(30, 15, 45, 0.82);
      border: 1px solid rgba(245, 158, 11, 0.45);
      border-radius: 18px;
      padding: 22px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(245, 158, 11, 0.15);
      backdrop-filter: blur(10px);
      margin-top: 10px;
      animation: fadeInUp 1.2s ease backwards;
      animation-delay: 0.5s;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .note-text {
      font-family: 'Poppins', sans-serif;
      font-size: 1.02rem;
      font-weight: 300;
      line-height: 1.8;
      color: #fef08a;
      font-style: italic;
      text-shadow: 0 0 6px rgba(0,0,0,0.6);
    }

    .note-sign {
      margin-top: 14px;
      font-family: 'Cinzel Decorative', serif;
      font-size: 0.95rem;
      color: #fbbf24;
      letter-spacing: 1px;
    }

    /* Extra Burst Button */
    .burst-more-btn {
      margin-top: 22px;
      padding: 10px 24px;
      background: linear-gradient(135deg, #d97706, #b45309);
      border: 1px solid #fde68a;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(217, 119, 6, 0.5);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .burst-more-btn:active {
      transform: scale(0.95);
      box-shadow: 0 2px 10px rgba(217, 119, 6, 0.4);
    }
  </style>
</head>
<body>

  <!-- Floating Sky Lanterns -->
  <div class="lantern-container" id="lanterns"></div>

  <!-- Fireworks Canvas -->
  <canvas id="fireworksCanvas"></canvas>

  <div class="main-wrapper">
    <!-- Initial Diya Button -->
    <div id="startScreen">
      <button class="diya-btn" id="igniteBtn" aria-label="Light the Diya">
        <div class="flame"></div>
        <div class="diya-base"></div>
      </button>
      <p class="hint-text">✨ Touch the diya to begin ✨</p>
    </div>

    <!-- Surprise Photo & Greetings Reveal -->
    <div id="revealSection">
      <h1 class="wishing-title">Shubh Deepavali</h1>
      <div class="girlfriend-name">Pyaarii</div>

      <div class="photo-card">
        <div class="photo-inner">
          <img src="pyaarii.jpg" alt="Pyaarii" />
        </div>
      </div>

      <div class="note-card">
        <p class="note-text">
          “Thank you so much pyaarii for coming into my life and making it worth living. Jab aap aayi toh meri zindagi mai khushiya aayi. You are the light to my darkness. I love you and Happy Diwali pyaarii.”
        </p>
        <div class="note-sign">Forever Yours ❤️</div>
      </div>

      <button class="burst-more-btn" id="burstMoreBtn">💥 Spark Again 💥</button>
    </div>
  </div>

  <script>
    /* ==========================================================
       1. Ambient Floating Lanterns Generation
       ========================================================== */
    const lanternContainer = document.getElementById('lanterns');
    for (let i = 0; i < 15; i++) {
      const lantern = document.createElement('div');
      lantern.className = 'sky-lantern';
      lantern.style.left = `${Math.random() * 95}%`;
      lantern.style.animationDuration = `${9 + Math.random() * 8}s`;
      lantern.style.animationDelay = `${Math.random() * 6}s`;
      lantern.style.transform = `scale(${0.6 + Math.random() * 0.7})`;
      lanternContainer.appendChild(lantern);
    }

    /* ==========================================================
       2. Web Audio Crackle / Boom Sound Effect (No MP3s Needed)
       ========================================================== */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playCrackleBurst() {
      try {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        // White noise burst for fireworks pop
        const bufferSize = audioCtx.sampleRate * 0.4;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(900, audioCtx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.35);

        const gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(0.7, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);

        whiteNoise.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        whiteNoise.start();
      } catch (e) {
        // Audio might be blocked on some strict browser settings
      }
    }

    /* ==========================================================
       3. Dynamic Canvas Fireworks Engine
       ========================================================== */
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const particles = [];
    const colors = [
      '#ffd700', '#ff9900', '#ff3366', '#00e5ff', 
      '#76ff03', '#ff0055', '#ffeb3b', '#e040fb'
    ];

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6.5 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.018 + 0.012;
        this.gravity = 0.12;
        this.size = Math.random() * 3 + 2;
      }

      update() {
        this.vx *= 0.98;
        this.vy *= 0.98;
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function createFirework(x, y, count = 75) {
      playCrackleBurst();
      const color = colors[Math.floor(Math.random() * colors.length)];
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    function animateFireworks() {
      ctx.clearRect(0, 0, width, height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }
      requestAnimationFrame(animateFireworks);
    }
    animateFireworks();

    /* ==========================================================
       4. Reveal Interaction Trigger
       ========================================================== */
    const startScreen = document.getElementById('startScreen');
    const revealSection = document.getElementById('revealSection');
    const igniteBtn = document.getElementById('igniteBtn');
    const burstMoreBtn = document.getElementById('burstMoreBtn');

    function launchCelebration() {
      // Hide opening button
      startScreen.classList.add('hidden');

      // Sequence of firework bursts
      const centerX = width / 2;
      const centerY = height * 0.35;

      createFirework(centerX, centerY, 100);

      setTimeout(() => createFirework(centerX - 120, centerY - 60, 80), 200);
      setTimeout(() => createFirework(centerX + 120, centerY - 50, 80), 400);
      setTimeout(() => createFirework(centerX, centerY - 100, 110), 650);

      // Reveal her card smoothly
      setTimeout(() => {
        revealSection.classList.add('active');
      }, 700);

      // Extra ongoing fireworks for ambiance
      let extraCount = 0;
      const interval = setInterval(() => {
        if (extraCount > 6) {
          clearInterval(interval);
          return;
        }
        createFirework(
          Math.random() * (width * 0.8) + width * 0.1, 
          Math.random() * (height * 0.5) + height * 0.1, 
          60
        );
        extraCount++;
      }, 600);
    }

    igniteBtn.addEventListener('click', launchCelebration);

    burstMoreBtn.addEventListener('click', () => {
      createFirework(Math.random() * (width * 0.7) + width * 0.15, height * 0.3, 90);
      setTimeout(() => {
        createFirework(Math.random() * (width * 0.7) + width * 0.15, height * 0.25, 90);
      }, 250);
    });

    // Tap anywhere on the page to spawn mini fireworks
    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button') || !revealSection.classList.contains('active')) return;
      createFirework(e.clientX, e.clientY, 40);
    });
  </script>
</body>
</html>
